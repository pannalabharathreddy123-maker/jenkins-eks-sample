apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-node-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-node-app
  template:
    metadata:
      labels:
        app: my-node-app
    spec:
      containers:
      - name: my-node-app
        image: 656132068779.dkr.ecr.us-east-1.amazonaws.com/my-node-project:latest
        ports:
        - containerPort: 3000

